name = "${WORKER_NAME}"
account_id = "${CLOUDFLARE_ACCOUNT_ID}"
main = "dist/index.js"
compatibility_date = "2023-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "KV_STORAGE"
id = "${CF_KV_NAMESPACE_ID}"
preview_id = "${KV_PREVIEW_ID}"

[vars]
AXIOM_TOKEN = "${AXIOM_TOKEN}"
AXIOM_ORG_ID = "${AXIOM_ORG_ID}"
AXIOM_DATASET = "${AXIOM_DATASET}"
QSTASH_CURRENT_SIGNING_KEY = "${QSTASH_CURRENT_SIGNING_KEY}"
QSTASH_NEXT_SIGNING_KEY = "${QSTASH_NEXT_SIGNING_KEY}"
SIGNATURE_EXPIRATION_WINDOW = "${SIGNATURE_EXPIRATION_WINDOW}"
UPSTASH_REDIS_REST_URL = "${UPSTASH_REDIS_REST_URL}"
UPSTASH_REDIS_REST_TOKEN = "${UPSTASH_REDIS_REST_TOKEN}"
SKIP_SIGNATURE_VERIFY = "${SKIP_SIGNATURE_VERIFY}"
NODE_ENV = "${NODE_ENV}"
# Northflank Redis 配置 (新增)
NF_REDIS_URL = "${NF_REDIS_URL}"
NF_REDIS_PASSWORD = "${NF_REDIS_PASSWORD}"
# Cloudflare Cache 配置 (新增)
CF_CACHE_ACCOUNT_ID = "${CF_CACHE_ACCOUNT_ID}"
CF_CACHE_NAMESPACE_ID = "${CF_CACHE_NAMESPACE_ID}"
CF_CACHE_TOKEN = "${CF_CACHE_TOKEN}"
NF_REDIS_HOST = "${NF_REDIS_HOST}"
NF_REDIS_PORT = "${NF_REDIS_PORT}"
NF_REDIS_TLS_ENABLED = "${NF_REDIS_TLS_ENABLED}"
NF_REDIS_TLS_REJECT_UNAUTHORIZED = "${NF_REDIS_TLS_REJECT_UNAUTHORIZED}"
NF_REDIS_TLS_CA = "${NF_REDIS_TLS_CA}"
NF_REDIS_TLS_CLIENT_CERT = "${NF_REDIS_TLS_CLIENT_CERT}"
NF_REDIS_TLS_CLIENT_KEY = "${NF_REDIS_TLS_CLIENT_KEY}"
NF_REDIS_SNI_SERVERNAME = "${NF_REDIS_SNI_SERVERNAME}"
REDIS_HOST = "${REDIS_HOST}"
REDIS_PORT = "${REDIS_PORT}"
REDIS_MAX_RETRIES = "${REDIS_MAX_RETRIES}"
REDIS_RESTART_DELAY = "${REDIS_RESTART_DELAY}"
R2_ENDPOINT = "${R2_ENDPOINT}"
R2_ACCESS_KEY_ID = "${R2_ACCESS_KEY_ID}"
R2_SECRET_ACCESS_KEY = "${R2_SECRET_ACCESS_KEY}"
R2_BUCKET = "${R2_BUCKET}"
R2_PUBLIC_URL = "${R2_PUBLIC_URL}"
OSS_WORKER_URL = "${OSS_WORKER_URL}"
OSS_WORKER_SECRET = "${OSS_WORKER_SECRET}"

[observability]
enabled = true
# 采样率：1.0 表示 100% 记录，0.1 表示记录 10%
head_sampling_rate = 1