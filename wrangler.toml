name = "drive-collector-lb"
main = "dist/index.js"
compatibility_date = "2023-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "KV_STORAGE"
id = ""
preview_id = ""

[vars]
AXIOM_TOKEN = ""
AXIOM_ORG_ID = ""
AXIOM_DATASET = "drive-collector"
QSTASH_CURRENT_SIGNING_KEY = ""
QSTASH_NEXT_SIGNING_KEY = ""
SIGNATURE_EXPIRATION_WINDOW = "900"
UPSTASH_REDIS_REST_URL = ""
UPSTASH_REDIS_REST_TOKEN = ""
SKIP_SIGNATURE_VERIFY = ""
NODE_ENV = "production"
# Northflank Redis 配置 (新增)
# NF_REDIS_URL = ""
# NF_REDIS_TOKEN = ""
# Cloudflare Cache 配置 (新增)
# CF_CACHE_ACCOUNT_ID = ""
# CF_CACHE_NAMESPACE_ID = ""
# CF_CACHE_TOKEN = ""

[observability]
enabled = true
# 采样率：1.0 表示 100% 记录，0.1 表示记录 10%
head_sampling_rate = 1