name: Sync Manifest to Contract Center

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'manifest.json'
      - '.github/workflows/sync-manifest.yml'  # 当工作流文件本身变动时也执行
  workflow_dispatch:      # 允许手动触发 workflow

jobs:
  update-registry:
    runs-on: ubuntu-latest
    env:
      # 将仓库地址和名称设为变量，方便后续脚本引用
      CONTRACT_REPO: ${{ secrets.CONTRACT_REPO }}
      REPO_DIR: "contract-repo"
      REGISTRY_PATH: "registry"
    steps:
      # 1. 检查 Secrets (Debug 模式)
      - name: Check Secrets Presence
        env:
          # 显式映射 secret 到环境变量，以便在脚本中检查
          # 注意：为了安全，不要直接打印 secret 的值！
          DEBUG_APP_ID: ${{ secrets.APP_ID }}
          DEBUG_APP_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          echo "=== Debugging Secrets ==="
          
          if [ -z "$DEBUG_APP_ID" ]; then
            echo "::error::Secrets.APP_ID is EMPTY or NOT FOUND."
          else
            # 显示前 4 位，方便排查是否配置正确
            echo "✅ Secrets.APP_ID is set (Length: ${#DEBUG_APP_ID}). Start with: ${DEBUG_APP_ID:0:4}***"
          fi
          
          if [ -z "$DEBUG_APP_KEY" ]; then
            echo "::error::Secrets.APP_PRIVATE_KEY is EMPTY or NOT FOUND."
          else
            # 显示前 15 位，确认是否以 -----BEGIN 开头
            echo "✅ Secrets.APP_PRIVATE_KEY is set (Length: ${#DEBUG_APP_KEY}). Start with: ${DEBUG_APP_KEY:0:15}***"
          fi
          
          echo "========================="

      # 2. 获取临时访问令牌 (使用之前创建的 GitHub App)
      - name: Generate Token
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      # 2. 检出当前子仓库代码
      - name: Checkout Sub-Repo
        uses: actions/checkout@v4

      # 3. 检出契约中心仓库
      - name: Checkout Contract Center
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONTRACT_REPO }}
          token: ${{ steps.generate_token.outputs.token }}
          path: ${{ env.REPO_DIR }} # 检出到子目录

      # 4. 同步文件并提交
      - name: Sync and Commit
        run: |
          # 获取当前仓库名称，作为注册表里的文件名
          SELF_REPO_NAME=$(basename ${{ github.repository }})
          
          # 【新增】确保目标目录存在，防止 cp 失败
          mkdir -p ${{ env.REPO_DIR }}/${{ env.REGISTRY_PATH }}

          # 将本地 manifest 拷贝到契约仓的 registry 目录
          cp manifest.json ${{ env.REPO_DIR }}/${{ env.REGISTRY_PATH }}/${SELF_REPO_NAME}.json

          git config --global --add safe.directory "$GITHUB_WORKSPACE/${{ env.REPO_DIR }}"
          cd ${{ env.REPO_DIR }}
          git config user.name "Manifest Bot"
          git config user.email "bot@internal.local"
          
          # 检查是否有文件变动，防止空提交报错
          if [[ -n $(git status -s) ]]; then
            git add ${{ env.REGISTRY_PATH }}/${SELF_REPO_NAME}.json
            git commit -m "chore: update manifest for ${SELF_REPO_NAME}"
            git push
          else
            echo "No changes in manifest. Skipping push."
          fi