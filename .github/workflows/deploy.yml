name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ "**" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Actions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install build tools
        run: npm install --no-save esbuild wrangler

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Fetch secrets via Infisical CLI
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          # Determine environment based on branch
          # main -> prod, develop -> dev, others -> staging
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            INFISICAL_ENV="prod"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            INFISICAL_ENV="dev"
          else
            INFISICAL_ENV="staging"
          fi
          
          echo "Fetching secrets for environment: $INFISICAL_ENV"
          echo "INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}"
          echo "INFISICAL_TOKEN: ${INFISICAL_TOKEN:0:10}..."  # 只显示前10个字符用于调试
          
          # 2026-01-04: 修复 GHA 环境下 ${{ vars.INFISICAL_PROJECT_ID }} 可能为空的问题
          # 如果 vars.INFISICAL_PROJECT_ID 为空，使用 .act.secrets 中的值作为回退
          if [ -z "${INFISICAL_PROJECT_ID}" ]; then
            echo "警告: INFISICAL_PROJECT_ID 为空，尝试使用回退值"
            INFISICAL_PROJECT_ID="st.754d483a-fb66-464b-928e-8590f754649f.410aabc1ea2b16b939a7702251325bf2.99c53f3bca3dbbadf17cb0f564483fd3"
            echo "使用回退的 INFISICAL_PROJECT_ID"
          fi
          
          # 检查 INFISICAL_TOKEN 是否有效
          if [ -z "${INFISICAL_TOKEN}" ]; then
            echo "错误: INFISICAL_TOKEN 未设置"
            echo "请检查 GitHub Secrets 中是否配置了 INFISICAL_TOKEN"
            exit 1
          fi
          
          # 尝试使用 Infisical CLI 拉取密钥
          echo "正在使用 Infisical CLI 拉取密钥..."
          if infisical export --env="$INFISICAL_ENV" --projectId="$INFISICAL_PROJECT_ID" --format=dotenv >> $GITHUB_ENV; then
            echo "成功从 Infisical 拉取密钥"
          else
            echo "错误: 从 Infisical 拉取密钥失败"
            echo "请检查:"
            echo "  1. INFISICAL_TOKEN 是否有效"
            echo "  2. INFISICAL_PROJECT_ID 是否正确"
            echo "  3. Infisical 项目中是否配置了对应环境的密钥"
            exit 1
          fi

      - name: Mask Infisical Secrets
        shell: bash
        run: |
          # 从 manifest.json 动态读取所有需要隐藏的环境变量
          # 包括 config.env 和 infrastructure 中的所有变量
          if [ -f "manifest.json" ]; then
            # 提取 config.env 中的变量名
            CONFIG_ENV_KEYS=$(node -e "
              const manifest = require('./manifest.json');
              const envConfig = manifest.config?.env || {};
              console.log(Object.keys(envConfig).join(' '));
            ")
            
            # 提取 infrastructure 中的变量名
            INFRA_KEYS=$(node -e "
              const manifest = require('./manifest.json');
              const infraConfig = manifest.infrastructure || {};
              console.log(Object.keys(infraConfig).join(' '));
            ")
            
            # 合并所有需要遮蔽的变量名
            ALL_KEYS="$CONFIG_ENV_KEYS $INFRA_KEYS"
            
            echo "动态检测到需要遮蔽的变量: $ALL_KEYS"
            
            for KEY in $ALL_KEYS; do
              VALUE="${!KEY}" # 间接引用获取变量的值
              if [ -n "$VALUE" ]; then
                echo "::add-mask::$VALUE"
                echo "Masked: $KEY"
              fi
            done
          else
            echo "警告: manifest.json 不存在，使用默认变量列表"
            # 回退到硬编码列表
            DEFAULT_KEYS=(
              "AXIOM_TOKEN" "AXIOM_ORG_ID" "CLOUDFLARE_API_TOKEN" "CLOUDFLARE_ACCOUNT_ID"
              "QSTASH_CURRENT_SIGNING_KEY" "QSTASH_NEXT_SIGNING_KEY"
              "UPSTASH_REDIS_REST_TOKEN" "UPSTASH_REDIS_REST_URL"
              "NF_REDIS_PASSWORD" "NF_REDIS_URL"
              "BARK_DEVICE_TOKEN" "CF_D1_TOKEN" "BARK_WEBHOOK_URL" "CF_D1_DATABASE_ID"
            )
            for KEY in "${DEFAULT_KEYS[@]}"; do
              VALUE="${!KEY}"
              if [ -n "$VALUE" ]; then
                echo "::add-mask::$VALUE"
                echo "Masked: $KEY"
              fi
            done
          fi

      - name: Validate Manifest
        run: npm run validate:manifest

      - name: Deploy
        # CLOUDFLARE_API_TOKEN is now fetched from Infisical and available in the environment
        run: npm run deploy

      - name: Notify Bark result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ GHA 部署成功"
          else
            TITLE="❌ GHA 部署失败"
          fi
          
          # Use printf to handle multiline content safely for JSON
          CONTENT="Workflow: ${{ github.workflow }}\nJob: ${{ github.job }}\nStatus: ${{ job.status }}\nCommit: ${{ github.sha }}"
          
          # Check if Bark environment variables are available
          if [ -z "$BARK_WEBHOOK_URL" ] || [ -z "$BARK_DEVICE_TOKEN" ]; then
            echo "BARK_WEBHOOK_URL or BARK_DEVICE_TOKEN not set, skipping notification"
            exit 0
          fi
          
          # Ensure BARK_WEBHOOK_URL ends with / if it's just the domain
          # 使用更健壮的方式清理首尾可能的引号或换行符
          CLEAN_URL=$(echo "${BARK_WEBHOOK_URL}" | sed -e 's/^[[:space:]'\'\"']*//' -e 's/[[:space:]'\'\"']*$//')
          BASE_URL="${CLEAN_URL%/}"
          
          # Construct JSON body for Bark POST API
          curl -L -f -s -X POST "$BASE_URL/push" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"title\": \"$TITLE\",
              \"body\": \"$CONTENT\",
              \"device_key\": \"$BARK_DEVICE_TOKEN\",
              \"group\": \"GHA\"
            }"