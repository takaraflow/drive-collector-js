name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Actions
    env:
      BARK_WEBHOOK_URL: ${{ secrets.BARK_WEBHOOK_URL }}
      BARK_DEVICE_TOKEN: ${{ secrets.BARK_DEVICE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install production dependencies
        run: npm ci --production

      - name: Install build tools
        run: npm install --no-save esbuild wrangler

      - name: Validate Manifest
        run: npm run validate:manifest

      - name: Deploy
        env:
          # 动态注入所有 Secrets 和 Vars (通过 JSON 字符串传递，避免手动列表)
          GHA_SECRETS_JSON: ${{ toJson(secrets) }}
          GHA_VARS_JSON: ${{ toJson(vars) }}
          
          # 核心必需环境变量 (Wrangler Auth 等)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Notify Bark result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ GHA 部署成功"
          else
            TITLE="❌ GHA 部署失败"
          fi
          
          # Use printf to handle multiline content safely for JSON
          CONTENT="Workflow: ${{ github.workflow }}\nJob: ${{ github.job }}\nStatus: ${{ job.status }}\nCommit: ${{ github.sha }}"
          
          # Ensure BARK_WEBHOOK_URL ends with / if it's just the domain
          BASE_URL="${{ env.BARK_WEBHOOK_URL }}"
          BASE_URL="${BASE_URL%/}"
          
          # Construct JSON body for Bark POST API
          curl -L -X POST "$BASE_URL/push" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"title\": \"$TITLE\",
              \"body\": \"$CONTENT\",
              \"device_key\": \"${{ env.BARK_DEVICE_TOKEN }}\",
              \"group\": \"GHA\"
            }"