name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ "**" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Actions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install build tools
        run: npm install --no-save esbuild wrangler

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Fetch secrets via Infisical CLI
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          # Determine environment based on branch
          # main -> prod, develop -> dev, others -> staging
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            INFISICAL_ENV="prod"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            INFISICAL_ENV="dev"
          else
            INFISICAL_ENV="staging"
          fi
          
          echo "Fetching secrets for environment: $INFISICAL_ENV"
          
          # Export secrets to GITHUB_ENV
          # We use the project ID from GitHub Variables.
          infisical export --env="$INFISICAL_ENV" --projectId="${{ vars.INFISICAL_PROJECT_ID }}" --format=dotenv >> $GITHUB_ENV

      - name: Validate Manifest
        run: npm run validate:manifest

      - name: Deploy
        # CLOUDFLARE_API_TOKEN is now fetched from Infisical and available in the environment
        run: npm run deploy

      - name: Notify Bark result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ GHA 部署成功"
          else
            TITLE="❌ GHA 部署失败"
          fi
          
          # Use printf to handle multiline content safely for JSON
          CONTENT="Workflow: ${{ github.workflow }}\nJob: ${{ github.job }}\nStatus: ${{ job.status }}\nCommit: ${{ github.sha }}"
          
          # Check if Bark environment variables are available
          if [ -z "$BARK_WEBHOOK_URL" ] || [ -z "$BARK_DEVICE_TOKEN" ]; then
            echo "BARK_WEBHOOK_URL or BARK_DEVICE_TOKEN not set, skipping notification"
            exit 0
          fi
          
          # Ensure BARK_WEBHOOK_URL ends with / if it's just the domain
          BASE_URL="${BARK_WEBHOOK_URL%/}"
          
          # Construct JSON body for Bark POST API
          curl -L -X POST "$BASE_URL/push" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"title\": \"$TITLE\",
              \"body\": \"$CONTENT\",
              \"device_key\": \"$BARK_DEVICE_TOKEN\",
              \"group\": \"GHA\"
            }"