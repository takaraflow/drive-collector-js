name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ "**" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Actions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install build tools
        run: npm install --no-save esbuild wrangler

      - name: Install Infisical CLI and jq
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical jq

      - name: Fetch secrets via Infisical CLI
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          # 使用 NODE_ENV 作为环境变量名
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "main" ]]; then
            NODE_ENV="prod"
          elif [[ "$BRANCH" == "develop" ]]; then
            NODE_ENV="dev"
          else
            NODE_ENV="staging"
          fi
          
          echo "Fetching secrets for environment: $NODE_ENV"
          
          # 2026-01-04: 修复 GHA 环境下 ${{ vars.INFISICAL_PROJECT_ID }} 可能为空的问题
          # 如果 vars.INFISICAL_PROJECT_ID 为空，明确失败而不是硬编码
          if [ -z "${INFISICAL_PROJECT_ID}" ]; then
            echo "错误: INFISICAL_PROJECT_ID 未设置"
            echo "请在 GitHub Variables 中设置 INFISICAL_PROJECT_ID，或使用 vars.INFISICAL_PROJECT_ID"
            exit 1
          fi
          
          # 检查 INFISICAL_TOKEN 是否有效
          if [ -z "${INFISICAL_TOKEN}" ]; then
            echo "错误: INFISICAL_TOKEN 未设置"
            echo "请检查 GitHub Secrets 中是否配置了 INFISICAL_TOKEN"
            exit 1
          fi
          
          # 检查 manifest.json 是否存在
          if [ ! -f "manifest.json" ]; then
            echo "错误: manifest.json 文件不存在"
            exit 1
          fi
          
          # 提取 config.env 中的变量名
          CONFIG_ENV_KEYS=$(node -e "
            const manifest = require('./manifest.json');
            const envConfig = manifest.config?.env || {};
            console.log(Object.keys(envConfig).join(' '));
          ")
          
          # 提取 infrastructure 中的变量名
          INFRA_KEYS=$(node -e "
            const manifest = require('./manifest.json');
            const infraConfig = manifest.infrastructure || {};
            console.log(Object.keys(infraConfig).join(' '));
          ")
          
          # 合并所有需要遮蔽的变量名
          ALL_KEYS="$CONFIG_ENV_KEYS $INFRA_KEYS"
          
          # 额外添加需要遮蔽但不在 manifest 中的变量
          EXTRA_KEYS="INFISICAL_PROJECT_ID"
          
          # 立即遮蔽敏感信息，防止后续步骤意外泄露
          echo "正在遮蔽敏感环境变量并输出长度..."
          
          for KEY in $ALL_KEYS $EXTRA_KEYS; do
            # 跳过 NODE_ENV，它不是敏感信息
            if [[ "$KEY" == "NODE_ENV" ]]; then
              continue
            fi
            VALUE="${!KEY}" # 间接引用获取变量的值
            if [ -n "$VALUE" ]; then
              echo "::add-mask::$VALUE"
              LENGTH=${#VALUE}
              echo "  遮蔽: $KEY (长度: ${LENGTH} 字符)"
            fi
          done
          
          # 尝试使用 Infisical CLI 拉取密钥
          echo "正在使用 Infisical CLI 拉取密钥..."
          
          # 生成动态分隔符，避免与 secret 值冲突
          DELIM="__INFISICAL_$(uuidgen | tr -d '-')__"
          
          # 先验证 Infisical 返回的 JSON 是否有效
          echo "验证 Infisical 返回的数据..."
          INFISICAL_OUTPUT=$(infisical export \
            --env="$NODE_ENV" \
            --projectId="$INFISICAL_PROJECT_ID" \
            --format=json)
          
          # 检查是否为空或无效 JSON
          if ! echo "$INFISICAL_OUTPUT" | jq -e 'type == "object" and length > 0' > /dev/null 2>&1; then
            echo "错误: Infisical 返回空配置或无效数据"
            echo "请检查:"
            echo "  1. 环境 '$NODE_ENV' 是否存在"
            echo "  2. 项目中是否配置了该环境的密钥"
            exit 1
          fi
          
          # 使用 jq 转换为 GitHub Actions 环境变量格式
          echo "正在转换为 GitHub Actions 环境变量格式..."
          if echo "$INFISICAL_OUTPUT" \
          | jq -r --arg d "$DELIM" '
            to_entries[] |
            ((.key | tostring) + "<<" + $d + "\n" + (.value // "" | tostring) + "\n" + $d)
          ' >> "$GITHUB_ENV"; then
            echo "成功从 Infisical 拉取密钥"
          else
            echo "错误: 从 Infisical 拉取密钥失败"
            echo "请检查:"
            echo "  1. INFISICAL_TOKEN 是否有效"
            echo "  2. INFISICAL_PROJECT_ID 是否正确"
            echo "  3. Infisical 项目中是否配置了对应环境的密钥"
            exit 1
          fi

      - name: Validate Manifest
        run: npm run validate:manifest

      - name: Verify Infisical Secrets Loaded
        shell: bash
        run: |
          echo "验证 Infisical 密钥是否已加载..."
          
          # 从 manifest.json 动态读取所有需要验证的环境变量
          if [ ! -f "manifest.json" ]; then
            echo "错误: manifest.json 文件不存在"
            exit 1
          fi
          
          # 提取 config.env 中的变量名
          CONFIG_ENV_KEYS=$(node -e "
            const manifest = require('./manifest.json');
            const envConfig = manifest.config?.env || {};
            console.log(Object.keys(envConfig).join(' '));
          ")
          
          # 提取 infrastructure 中的变量名
          INFRA_KEYS=$(node -e "
            const manifest = require('./manifest.json');
            const infraConfig = manifest.infrastructure || {};
            console.log(Object.keys(infraConfig).join(' '));
          ")
          
          # 合并所有需要验证的变量名
          ALL_KEYS="$CONFIG_ENV_KEYS $INFRA_KEYS"
          
          echo "从 manifest.json 读取到的环境变量列表:"
          echo "$ALL_KEYS"
          echo ""
          
          MISSING_VARS=()
          for KEY in $ALL_KEYS; do
            # 跳过 NODE_ENV，它不是密钥
            if [[ "$KEY" == "NODE_ENV" ]]; then
              continue
            fi
            
            VALUE="${!KEY}"
            if [ -z "$VALUE" ]; then
              echo "❌ 缺少: $KEY"
              MISSING_VARS+=("$KEY")
            else
              LENGTH=${#VALUE}
              echo "✅ 已设置: $KEY (长度: ${LENGTH} 字符)"
              
              # 根据变量名模式进行长度验证
              if [[ "$KEY" =~ (TOKEN|KEY|PASSWORD|SECRET)$ ]]; then
                if [ $LENGTH -lt 20 ]; then
                  echo "   ⚠️  警告: $KEY 长度异常 (仅 ${LENGTH} 字符，预期至少 20)"
                fi
              fi
              
              # URL 格式验证
              if [[ "$KEY" =~ URL$ ]]; then
                if [[ ! "$VALUE" =~ ^https?:// ]]; then
                  echo "   ⚠️  警告: $KEY 格式异常 (不是有效的 URL)"
                fi
              fi
            fi
          done
          
          echo ""
          if [ ${#MISSING_VARS[@]} -gt 0 ]; then
            echo "错误: 以下关键变量未设置: ${MISSING_VARS[*]}"
            echo "这可能意味着 Infisical 密钥拉取失败或变量名不匹配"
            exit 1
          fi
          
          echo "所有环境变量验证通过"

      - name: Deploy
        # CLOUDFLARE_API_TOKEN is now fetched from Infisical and available in the environment
        run: npm run deploy

      - name: Notify Bark result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ GHA 部署成功"
          else
            TITLE="❌ GHA 部署失败"
          fi
          
          # Use printf to handle multiline content safely for JSON
          CONTENT="Workflow: ${{ github.workflow }}\nJob: ${{ github.job }}\nStatus: ${{ job.status }}\nCommit: ${{ github.sha }}"
          
          # Check if Bark environment variables are available
          if [ -z "$BARK_WEBHOOK_URL" ] || [ -z "$BARK_DEVICE_TOKEN" ]; then
            echo "BARK_WEBHOOK_URL or BARK_DEVICE_TOKEN not set, skipping notification"
            exit 0
          fi
          
          # Ensure BARK_WEBHOOK_URL ends with / if it's just the domain
          # 使用更健壮的方式清理首尾可能的引号或换行符
          CLEAN_URL=$(echo "${BARK_WEBHOOK_URL}" | sed -e 's/^[[:space:]'\'\"']*//' -e 's/[[:space:]'\'\"']*$//')
          BASE_URL="${CLEAN_URL%/}"
          
          # Construct JSON body for Bark POST API
          curl -L -f -s -X POST "$BASE_URL/push" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"title\": \"$TITLE\",
              \"body\": \"$CONTENT\",
              \"device_key\": \"$BARK_DEVICE_TOKEN\",
              \"group\": \"GHA\"
            }"