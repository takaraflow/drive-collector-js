name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Actions
    env:
      BARK_WEBHOOK_URL: ${{ secrets.BARK_WEBHOOK_URL }}
      BARK_DEVICE_TOKEN: ${{ secrets.BARK_DEVICE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install production dependencies
        run: npm ci --production

      - name: Install build tools
        run: npm install --no-save esbuild wrangler

      - name: Deploy
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          KV_PREVIEW_ID: ${{ secrets.KV_PREVIEW_ID }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_ORG_ID: ${{ secrets.AXIOM_ORG_ID }}
          AXIOM_DATASET: ${{ vars.AXIOM_DATASET }}
          QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NODE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Notify Bark result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅%20GHA%20部署成功"
          else
            TITLE="❌%20GHA%20部署失败"
          fi
          
          CONTENT="Workflow:%20${{ github.workflow }}%0AJob:%20${{ github.job }}%0AStatus:%20${{ job.status }}%0ACommit:%20${{ github.sha }}"
          
          curl -L -X GET "${{ env.BARK_WEBHOOK_URL }}${{ env.BARK_DEVICE_TOKEN }}${TITLE}/${CONTENT}?group=GHA"