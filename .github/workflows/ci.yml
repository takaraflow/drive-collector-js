name: CI

on:
  push:
    branches: [main, develop]
    tags: ['*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./cmd/...

      - name: Test with race detector
        run: go test -race -count=1 ./cmd/...

  docker-edge-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [go]
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Go collector image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.edge
          push: false
          load: true
          tags: drive-collector-edge:ci
